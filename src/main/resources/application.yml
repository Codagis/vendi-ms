spring:
  application:
    name: vendi-ms
  profiles:
    active: dev 
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
  level:
    org.springframework: INFO
    org.hibernate: INFO

management:
  info:
    env:
      enabled: true
